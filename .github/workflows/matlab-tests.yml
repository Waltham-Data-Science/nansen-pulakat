name: MATLAB Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Requires matlab-actions/setup-matlab. For private repos configure a
# MathWorks account token in Actions secrets (MATHWORKS_ACCOUNT). Public
# repos get a free batch license.
#
# The cloud integration tests additionally need NDI cloud credentials as
# repo secrets (NDI_CLOUD_USERNAME, NDI_CLOUD_PASSWORD). The cloud job
# is skipped automatically when those secrets aren't present.
jobs:
  offline-tests:
    name: Offline integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          path: nansen-pulakat

      - name: Check out NANSEN (dev)
        uses: actions/checkout@v4
        with:
          repository: VervaekeLab/NANSEN
          ref: dev
          path: NANSEN

      - name: Check out NDI-matlab
        uses: actions/checkout@v4
        with:
          repository: VH-Lab/NDI-matlab
          path: NDI-matlab

      - name: Check out openMINDS
        uses: actions/checkout@v4
        with:
          repository: openMetadataInitiative/openMINDS_MATLAB
          path: openMINDS_MATLAB

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          cache: true

      - name: Ensure userpath is set (nansen_install prompts otherwise)
        run: |
          mkdir -p "$HOME/matlab-userpath"

      - name: Run offline tests
        uses: matlab-actions/run-command@v2
        with:
          # Dependency bootstrap, in order of what does and does not work
          # in a headless CI session:
          #
          #   * nansen_install() refuses to run with an empty userpath
          #     (it wants to prompt). Pre-set userpath, then call it
          #     to pick up matbox and the rest of nansen's runtime deps.
          #   * openMINDS setup.m works out of the box.
          #   * ndi_install is intentionally skipped: it pulls 10+
          #     vhlab-* toolboxes the offline suite does not use, and
          #     on recent MATLAB versions it trips over a parse error
          #     inside openMINDS's own startup.m that blanks the path
          #     mid-install. addpath(genpath('NDI-matlab')) is enough
          #     to resolve the ndi.* classes these tests touch.
          command: |
            userPathDir = fullfile(getenv('HOME'), 'matlab-userpath');
            userpath(userPathDir);
            addpath(genpath('NANSEN'));
            addpath(genpath('NDI-matlab'));
            addpath(genpath('openMINDS_MATLAB'));
            addpath(genpath('nansen-pulakat'));
            try; nansen_install('SavePath', false); catch ME; ...
                warning('nansen_install failed: %s', ME.message); end
            try; run(fullfile('openMINDS_MATLAB','code','setup.m')); catch ME; ...
                warning('openMINDS setup failed: %s', ME.message); end
            % Re-addpath in case nansen_install / openMINDS setup
            % disturbed path ordering.
            addpath(genpath('NANSEN'));
            addpath(genpath('NDI-matlab'));
            addpath(genpath('openMINDS_MATLAB'));
            addpath(genpath('nansen-pulakat'));
            offlineTests = { ...
                'ndi.unittest.nansen.CreateProject', ...
                'ndi.unittest.nansen.ReadProjectInfo', ...
                'ndi.unittest.nansen.GetIdentifier', ...
                'ndi.unittest.nansen.MatchTables', ...
                'ndi.unittest.nansen.GetCompleteUniqueRows', ...
                'ndi.unittest.nansen.MetatableMerge', ...
                'ndi.unittest.nansen.MetatableEdit', ...
                'ndi.unittest.nansen.ImportSubjectTableFromFile', ...
                'ndi.unittest.nansen.SyncRepo'};
            results = runtests(offlineTests);
            assertSuccess(results);

  cloud-tests:
    name: Cloud integration tests
    runs-on: ubuntu-latest
    needs: offline-tests
    # Only run if cloud credentials are configured; otherwise skip cleanly
    # rather than fail the whole workflow.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    steps:
      - name: Verify cloud secrets are present
        id: check_secrets
        env:
          NDI_CLOUD_USERNAME: ${{ secrets.NDI_CLOUD_USERNAME }}
        run: |
          if [ -z "${NDI_CLOUD_USERNAME}" ]; then
            echo "cloud_credentials_set=false" >> "$GITHUB_OUTPUT"
            echo "::notice ::NDI_CLOUD_USERNAME secret not set; skipping cloud tests."
          else
            echo "cloud_credentials_set=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out code
        if: steps.check_secrets.outputs.cloud_credentials_set == 'true'
        uses: actions/checkout@v4
        with:
          path: nansen-pulakat

      - name: Check out NANSEN (dev)
        if: steps.check_secrets.outputs.cloud_credentials_set == 'true'
        uses: actions/checkout@v4
        with:
          repository: VervaekeLab/NANSEN
          ref: dev
          path: NANSEN

      - name: Check out NDI-matlab
        if: steps.check_secrets.outputs.cloud_credentials_set == 'true'
        uses: actions/checkout@v4
        with:
          repository: VH-Lab/NDI-matlab
          path: NDI-matlab

      - name: Check out openMINDS
        if: steps.check_secrets.outputs.cloud_credentials_set == 'true'
        uses: actions/checkout@v4
        with:
          repository: openMetadataInitiative/openMINDS_MATLAB
          path: openMINDS_MATLAB

      - name: Set up MATLAB
        if: steps.check_secrets.outputs.cloud_credentials_set == 'true'
        uses: matlab-actions/setup-matlab@v2
        with:
          cache: true

      - name: Ensure userpath is set
        if: steps.check_secrets.outputs.cloud_credentials_set == 'true'
        run: |
          mkdir -p "$HOME/matlab-userpath"

      - name: Run cloud tests
        if: steps.check_secrets.outputs.cloud_credentials_set == 'true'
        uses: matlab-actions/run-command@v2
        env:
          NDI_CLOUD_USERNAME: ${{ secrets.NDI_CLOUD_USERNAME }}
          NDI_CLOUD_PASSWORD: ${{ secrets.NDI_CLOUD_PASSWORD }}
          CLOUD_API_ENVIRONMENT: prod
        with:
          # See the offline job for why ndi_install is skipped.
          # The cloud tests still need nansen + NDI-matlab + openMINDS
          # on the path, and an authenticated cloud session.
          command: |
            userPathDir = fullfile(getenv('HOME'), 'matlab-userpath');
            userpath(userPathDir);
            addpath(genpath('NANSEN'));
            addpath(genpath('NDI-matlab'));
            addpath(genpath('openMINDS_MATLAB'));
            addpath(genpath('nansen-pulakat'));
            try; nansen_install('SavePath', false); catch ME; ...
                warning('nansen_install failed: %s', ME.message); end
            try; run(fullfile('openMINDS_MATLAB','code','setup.m')); catch ME; ...
                warning('openMINDS setup failed: %s', ME.message); end
            addpath(genpath('NANSEN'));
            addpath(genpath('NDI-matlab'));
            addpath(genpath('openMINDS_MATLAB'));
            addpath(genpath('nansen-pulakat'));
            cloudTests = { ...
                'ndi.unittest.nansen.CreateDataset', ...
                'ndi.unittest.nansen.Startup', ...
                'ndi.unittest.nansen.ImportSession'};
            results = runtests(cloudTests);
            assertSuccess(results);
