name: MATLAB Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
  # Manual trigger with a MATLAB-release picker so we can reproduce
  # client-side behaviour against a specific release. Default to
  # 'latest' on automatic runs. Mirrors NDI-matlab's pattern in
  # .github/workflows/run-tests.yml.
  workflow_dispatch:
    inputs:
      matlab_release:
        description: 'MATLAB Release'
        required: false
        default: 'latest'
        type: choice
        options:
          - 'latest'
          - 'R2025a'
          - 'R2024b'
          - 'R2024a'
          - 'R2023b'
          - 'R2023a'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Based on the patterns used by NDI-matlab (.github/workflows/run-tests.yml)
# and NANSEN (.github/workflows/test-code.yml). Uses xvfb so MATLAB's
# headless addon-install dialogs can be satisfied, and delegates matbox
# setup to ehennestad/matbox-actions/install-matbox so we don't re-run
# the interactive nansen_install path that failed in earlier attempts.
jobs:
  offline-tests:
    name: Offline tests (MATLAB ${{ inputs.matlab_release || 'latest' }})
    runs-on: ubuntu-latest
    steps:
      - name: Check out nansen-pulakat
        uses: actions/checkout@v4
        with:
          path: nansen-pulakat

      - name: Check out NANSEN (dev)
        uses: actions/checkout@v4
        with:
          repository: VervaekeLab/NANSEN
          ref: dev
          path: NANSEN

      - name: Check out NDI-matlab
        uses: actions/checkout@v4
        with:
          repository: VH-Lab/NDI-matlab
          path: NDI-matlab

      - name: Check out DID-matlab
        uses: actions/checkout@v4
        with:
          repository: VH-Lab/DID-matlab
          path: DID-matlab

      - name: Check out vhlab-toolbox-matlab
        uses: actions/checkout@v4
        with:
          repository: VH-Lab/vhlab-toolbox-matlab
          path: vhlab-toolbox-matlab

      - name: Check out mksqlite
        uses: actions/checkout@v4
        with:
          repository: a-ma72/mksqlite
          path: mksqlite

      - name: Check out openMINDS
        uses: actions/checkout@v4
        with:
          repository: openMetadataInitiative/openMINDS_MATLAB
          path: openMINDS_MATLAB

      - name: Start virtual display server
        run: |
          sudo apt-get install -y xvfb
          Xvfb :99 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ inputs.matlab_release || 'latest' }}
          cache: true

      - name: Install MatBox
        uses: ehennestad/matbox-actions/install-matbox@v1

      - name: Build mksqlite MEX
        uses: matlab-actions/run-command@v2
        with:
          # mksqlite ships a buildit.m that compiles the MEX against
          # MATLAB's configured C compiler. Required because did.*
          # (NDI's database backend) dispatches through did.implementations.sqlitedb
          # which looks up mksqlite on the path. Without the MEX the
          # table's db stays empty and ndi.session.dir's opendatabase
          # call fails.
          command: |
            addpath('mksqlite');
            cd mksqlite;
            try; buildit; catch ME; warning('mksqlite buildit failed: %s', ME.message); end

      - name: Run offline tests
        uses: matlab-actions/run-command@v2
        with:
          # Builds a TestRunner with the CodeCoveragePlugin so we can
          # produce a Cobertura XML report for codecov, scoped to the
          # repo's src/ tree. assertSuccess runs after the runner so
          # the coverage file is already on disk even if tests failed.
          command: |
            import matlab.unittest.TestRunner
            import matlab.unittest.plugins.CodeCoveragePlugin
            import matlab.unittest.plugins.codecoverage.CoberturaFormat
            addpath(genpath('NANSEN/code'));
            addpath(genpath('NDI-matlab/src'));
            addpath(genpath('DID-matlab'));
            addpath(genpath('vhlab-toolbox-matlab'));
            addpath(genpath('mksqlite'));
            addpath(genpath('openMINDS_MATLAB/code'));
            addpath(genpath('nansen-pulakat/src'));
            addpath(genpath('nansen-pulakat/tests'));
            try; run(fullfile('openMINDS_MATLAB','code','setup.m')); catch ME; ...
                warning('openMINDS setup failed: %s', ME.message); end
            offlineTests = { ...
                'ndi.unittest.nansen.CreateProject', ...
                'ndi.unittest.nansen.ReadProjectInfo', ...
                'ndi.unittest.nansen.GetIdentifier', ...
                'ndi.unittest.nansen.MatchTables', ...
                'ndi.unittest.nansen.GetCompleteUniqueRows', ...
                'ndi.unittest.nansen.MetatableMerge', ...
                'ndi.unittest.nansen.MetatableEdit', ...
                'ndi.unittest.nansen.MetatableRemove', ...
                'ndi.unittest.nansen.FunHelpers', ...
                'ndi.unittest.nansen.ValidateDuplicates', ...
                'ndi.unittest.nansen.ValidateFileHasAllSubjects', ...
                'ndi.unittest.nansen.ExportMetadata', ...
                'ndi.unittest.nansen.ImportSubjectTableFromFile', ...
                'ndi.unittest.nansen.FileTypeParsers', ...
                'ndi.unittest.nansen.FileDetectType', ...
                'ndi.unittest.nansen.FileValidateTable', ...
                'ndi.unittest.nansen.PulakatPlugins', ...
                'ndi.unittest.nansen.SyncRepo'};
            suite = testsuite(offlineTests);
            runner = TestRunner.withTextOutput();
            runner.addPlugin(CodeCoveragePlugin.forFolder( ...
                {'nansen-pulakat/src/pulakat','nansen-pulakat/src/ndi'}, ...
                'IncludingSubfolders', true, ...
                'Producing', CoberturaFormat('coverage-offline.xml')));
            results = runner.run(suite);
            assertSuccess(results);

      - name: Upload offline coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-offline.xml
          flags: offline
          fail_ci_if_error: false

  cloud-tests:
    name: Cloud integration tests (MATLAB ${{ inputs.matlab_release || 'latest' }})
    runs-on: ubuntu-latest
    needs: offline-tests
    # Runs on every push + PR event, matching NDI-matlab's pattern, so
    # cloud-breaking changes surface in PR review rather than after merge.
    # When NDI_CLOUD_USERNAME isn't set as a repo secret the per-step
    # `if:` guards below still skip the real work and emit a notice.
    steps:
      - name: Verify cloud secrets are present
        id: check_secrets
        env:
          NDI_CLOUD_USERNAME: ${{ secrets.NDI_CLOUD_USERNAME }}
        run: |
          if [ -z "${NDI_CLOUD_USERNAME}" ]; then
            echo "cloud_credentials_set=false" >> "$GITHUB_OUTPUT"
            echo "::notice ::NDI_CLOUD_USERNAME secret not set; skipping cloud tests."
          else
            echo "cloud_credentials_set=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out nansen-pulakat
        if: steps.check_secrets.outputs.cloud_credentials_set == 'true'
        uses: actions/checkout@v4
        with:
          path: nansen-pulakat

      - name: Check out NANSEN (dev)
        if: steps.check_secrets.outputs.cloud_credentials_set == 'true'
        uses: actions/checkout@v4
        with:
          repository: VervaekeLab/NANSEN
          ref: dev
          path: NANSEN

      - name: Check out NDI-matlab
        if: steps.check_secrets.outputs.cloud_credentials_set == 'true'
        uses: actions/checkout@v4
        with:
          repository: VH-Lab/NDI-matlab
          path: NDI-matlab

      - name: Check out DID-matlab
        if: steps.check_secrets.outputs.cloud_credentials_set == 'true'
        uses: actions/checkout@v4
        with:
          repository: VH-Lab/DID-matlab
          path: DID-matlab

      - name: Check out vhlab-toolbox-matlab
        if: steps.check_secrets.outputs.cloud_credentials_set == 'true'
        uses: actions/checkout@v4
        with:
          repository: VH-Lab/vhlab-toolbox-matlab
          path: vhlab-toolbox-matlab

      - name: Check out mksqlite
        if: steps.check_secrets.outputs.cloud_credentials_set == 'true'
        uses: actions/checkout@v4
        with:
          repository: a-ma72/mksqlite
          path: mksqlite

      - name: Check out openMINDS
        if: steps.check_secrets.outputs.cloud_credentials_set == 'true'
        uses: actions/checkout@v4
        with:
          repository: openMetadataInitiative/openMINDS_MATLAB
          path: openMINDS_MATLAB

      - name: Start virtual display server
        if: steps.check_secrets.outputs.cloud_credentials_set == 'true'
        run: |
          sudo apt-get install -y xvfb
          Xvfb :99 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Set up MATLAB
        if: steps.check_secrets.outputs.cloud_credentials_set == 'true'
        uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ inputs.matlab_release || 'latest' }}
          cache: true

      - name: Install MatBox
        if: steps.check_secrets.outputs.cloud_credentials_set == 'true'
        uses: ehennestad/matbox-actions/install-matbox@v1

      - name: Build mksqlite MEX
        if: steps.check_secrets.outputs.cloud_credentials_set == 'true'
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath('mksqlite');
            cd mksqlite;
            try; buildit; catch ME; warning('mksqlite buildit failed: %s', ME.message); end

      - name: Run cloud tests
        if: steps.check_secrets.outputs.cloud_credentials_set == 'true'
        uses: matlab-actions/run-command@v2
        env:
          NDI_CLOUD_USERNAME: ${{ secrets.NDI_CLOUD_USERNAME }}
          NDI_CLOUD_PASSWORD: ${{ secrets.NDI_CLOUD_PASSWORD }}
          CLOUD_API_ENVIRONMENT: prod
        with:
          command: |
            import matlab.unittest.TestRunner
            import matlab.unittest.plugins.CodeCoveragePlugin
            import matlab.unittest.plugins.codecoverage.CoberturaFormat
            addpath(genpath('NANSEN/code'));
            addpath(genpath('NDI-matlab/src'));
            addpath(genpath('DID-matlab'));
            addpath(genpath('vhlab-toolbox-matlab'));
            addpath(genpath('mksqlite'));
            addpath(genpath('openMINDS_MATLAB/code'));
            addpath(genpath('nansen-pulakat/src'));
            addpath(genpath('nansen-pulakat/tests'));
            try; run(fullfile('openMINDS_MATLAB','code','setup.m')); catch ME; ...
                warning('openMINDS setup failed: %s', ME.message); end
            ndi.cloud.authenticate("InteractionEnabled", "off");
            cloudTests = { ...
                'ndi.unittest.nansen.CreateDataset', ...
                'ndi.unittest.nansen.Startup', ...
                'ndi.unittest.nansen.ImportSession'};
            suite = testsuite(cloudTests);
            runner = TestRunner.withTextOutput();
            runner.addPlugin(CodeCoveragePlugin.forFolder( ...
                {'nansen-pulakat/src/pulakat','nansen-pulakat/src/ndi'}, ...
                'IncludingSubfolders', true, ...
                'Producing', CoberturaFormat('coverage-cloud.xml')));
            results = runner.run(suite);
            assertSuccess(results);

      - name: Upload cloud coverage to Codecov
        if: always() && steps.check_secrets.outputs.cloud_credentials_set == 'true'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-cloud.xml
          flags: cloud
          fail_ci_if_error: false
